<dialog #dialog aria-labelledby="confirm-title" (close)="onClose()">
  <div class="panel">
    <h2 id="confirm-title">{{ heading() }}</h2>
    <p>{{ message() }}</p>
    <div class="actions">
      <button type="button" class="text-control" (click)="cancel()">Cancel</button>
      <button type="button" class="danger" (click)="confirm()">{{ confirmLabel() }}</button>
    </div>
  </div>
</dialog>
